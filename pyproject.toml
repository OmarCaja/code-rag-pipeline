[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "code-rag-pipeline"
version = "0.1.0"
description = "A local RAG system to index and query codebases using LlamaIndex, LanceDB, and Ollama."
authors = [{ name = "Omar Caja" }]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "llama-index-core>=0.10.0",
    "llama-index-vector-stores-lancedb>=0.2.0",
    "llama-index-llms-ollama>=0.2.0",
    "llama-index-embeddings-ollama>=0.2.0",
    "lancedb>=0.6.0",
    "pydantic>=2.0.0",
    "tree-sitter>=0.21.0",
    "tantivy>=0.20.0",
    "pandas>=3.0.5",
    "colorlog>=6.12.0",
    "typer>=0.27.1",
    "rich>=15.0.0",
    "tree-sitter-language-pack>=1.14.3",
]

[project.scripts]
code-rag = "code_rag_pipeline.cli.app:app"

[dependency-groups]
dev = [
    "mypy>=1.19.1",
    "pre-commit>=4.3.0",
]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = [
    "lancedb.*"
]
ignore_missing_imports = true

[tool.code-rag]
ollama_host = "http://localhost:11434"
llm_model = "qwen2.5-coder:7b"
embed_model = "nomic-embed-text"
data_dir = "data"
supported_extensions = [".py", ".js", ".ts", ".less", ".css", ".json", ".md", ".toml", ".yaml"]
exclude_paths = ["**/data/**"]

[tool.code-rag.ext_map]
py = "python"
js = "javascript"
ts = "typescript"
json = "json"
md = "markdown"
toml = "toml"
yaml = "yaml"
less = "less"
css = "css"
